name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    name: Deploy verified images to the OVH VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    env:
      PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
      PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
      PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
      PRODUCTION_HOST_KEYS: ${{ secrets.PRODUCTION_HOST_KEYS }}
      PRODUCTION_SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out the selected master commit
        uses: actions/checkout@v4

      - name: Prepare the production SSH identity
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$PRODUCTION_SSH_KEY" >"$HOME/.ssh/id_ed25519"
          printf '%s\n' "$PRODUCTION_HOST_KEYS" >"$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Package the production control files
        run: make release-package VERSION="$GITHUB_SHA" OUTPUT=illarin-release.tar.gz

      - name: Copy the control files to the VPS
        run: |
          set -euo pipefail
          scp -P "$PRODUCTION_SSH_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            illarin-release.tar.gz \
            "$PRODUCTION_USER@$PRODUCTION_HOST:/tmp/illarin-${GITHUB_SHA}.tar.gz"

      - name: Deploy the selected master commit
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | ssh -p "$PRODUCTION_SSH_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$PRODUCTION_USER@$PRODUCTION_HOST" \
            "docker login ghcr.io --username '${GITHUB_ACTOR}' --password-stdin"
          ssh -p "$PRODUCTION_SSH_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$PRODUCTION_USER@$PRODUCTION_HOST" \
            "mkdir -p '/opt/illarin/releases/${GITHUB_SHA}' && tar -xzf '/tmp/illarin-${GITHUB_SHA}.tar.gz' -C '/opt/illarin/releases/${GITHUB_SHA}' && ln -sfn '/opt/illarin/releases/${GITHUB_SHA}' /opt/illarin/current && rm '/tmp/illarin-${GITHUB_SHA}.tar.gz' && make -C /opt/illarin/current prod-deploy VERSION='${GITHUB_SHA}'"
