        - value
        - label
        - count
        - selected
      properties:
        value:
          type: string
        label:
          type: string
        count:
          type: integer
          minimum: 0
        selected:
          type: boolean
    BrowseFacet:
      type: object
      required:
        - key
        - label
        - options
      properties:
        key:
          type: string
        label:
          type: string
        options:
          type: array
          items:
            $ref: '#/components/schemas/BrowseOption'
    CreateAssetRequest:
      type: object
      required:
        - confirmed
      properties:
        confirmed:
          type: boolean
        name:
          type: string
        blurb:
          type: string
        tags:
          type: array
          items:
            type: string
        isNsfw:
          type: boolean
        discovery:
          type: string
          enum:
            - listed
            - unlisted
    AddMediaRequest:
      type: object
      additionalProperties: false
      required:
        - role
      properties:
        role:
          type: string
          enum:
            - avatar
            - expression
            - gallery
            - avatar_alt
            - perspective_layer
            - pack_item
    Media:
      type: object
      required:
        - id
        - assetId
        - role
        - width
        - height
        - derivativeVersion
      properties:
        id:
          type: string
          format: uuid
        assetId:
          type: string
          format: uuid
        role:
          type: string
          enum:
            - avatar
            - expression
            - gallery
            - avatar_alt
            - perspective_layer
            - pack_item
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        derivativeVersion:
          type: integer
          minimum: 1
    MediaList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Media'
    IngestOperation:
      type: object
      required:
        - id
        - status
        - url
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - pending
            - processing
            - failed
            - success
        url:
          type: string
        asset:
          anyOf:
            - $ref: '#/components/schemas/Asset'
            - type: 'null'
        failure:
          $ref: '#/components/schemas/IngestFailure'
    IngestFailure:
      type: object
      required:
        - reason
        - message
      properties:
        reason:
          type: string
          enum:
            - malformed_input
            - unsupported_format
            - unsupported_version
            - safety_violation
            - wrong_kind
            - internal_failure
        message:
          type: string
    ManagedInstance:
      allOf:
        - $ref: '#/components/schemas/LinkedInstance'
        - type: object
          required:
            - installed
            - updatesAvailable
          properties:
            installed:
              type: integer
              description: >-
                How many assets this instance has reported having installed. It
                is zero without the library:sync scope.
            updatesAvailable:
              type: integer
              description: >-
                How many of those the creator has since changed, so a newer
                content generation exists here than the instance reported.
    CollectDeliveries:
      type: object
      additionalProperties: false
      required:
        - acknowledge
      properties:
        acknowledge:
          type: array
          maxItems: 32
          uniqueItems: true
          description: >-
            The deliveries this instance has durably installed since its last
            request. Delivery is at least once, so treat the ids as stable and
            acknowledge only after the work is safely stored.
          items:
            type: string
            format: uuid
    DeliveryArtifact:
      type: object
      additionalProperties: false
      required:
        - kind
        - url
      properties:
        kind:
          type: string
          enum:
            - export
            - picture
        url:
          type: string
          description: A short-lived signed address fetched with an ordinary GET.
        mediaId:
          type: string
          format: uuid
        role:
          type: string
        isCover:
          type: boolean
    DeliveryWork:
      type: object
      additionalProperties: false
      required:
        - id
        - assetId
        - contentGeneration
        - kind
        - name
        - format
        - label
        - queuedAt
        - leaseExpiresAt
        - artifacts
      properties:
        id:
          type: string
          format: uuid
          description: The stable event id to acknowledge and to deduplicate on.
        assetId:
          type: string
          format: uuid
        contentGeneration:
          type: integer
          minimum: 1
          description: >-
            The update signal. Store it against the asset id; a newer one means
            the file changed.
        kind:
          type: string
        name:
          type: string
        format:
          type: string
          description: >-
            The chosen export target, or raw for the creator's own uploaded
            file.
        label:
          type: string
        queuedAt:
          type: string
          format: date-time
        leaseExpiresAt:
          type: string
          format: date-time
          description: >-
            When the artifact addresses stop answering and the delivery becomes
            collectable again.
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryArtifact'
    DeliveryWorkList:
      type: object
      additionalProperties: false
      required:
        - deliveries
      properties:
        deliveries:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryWork'
    LibraryEntry:
      type: object
      additionalProperties: false
      required:
        - assetId
      properties:
        assetId:
          type: string
          format: uuid
        contentGeneration:
          type: integer
          minimum: 1
          description: >-
            The generation this instance holds. Leave it out when the
            installation predates the counter; Illarin records the asset's
            current one rather than calling the install out of date.
    LibraryReport:
      type: object
      additionalProperties: false
      required:
        - snapshot
        - entries
      properties:
        snapshot:
          type: boolean
          description: >-
            True to replace the whole mirror for this instance. A snapshot
            carries no removals, because anything absent from it is removed.
        entries:
          type: array
          maxItems: 2000
          items:
            $ref: '#/components/schemas/LibraryEntry'
        removed:
          type: array
          maxItems: 2000
          uniqueItems: true
          items:
            type: string
            format: uuid
    LibraryReportResult:
      type: object
      additionalProperties: false
      required:
        - accepted
        - removed
        - ignored
      properties:
        accepted:
          type: integer
        removed:
          type: integer
        ignored:
          type: integer
          description: Entries naming an asset Illarin cannot offer.
    QueuedDelivery:
      type: object
      additionalProperties: false
      required:
        - id
        - instanceId
        - assetId
        - state
        - queuedAt
        - expiresAt
      properties:
        id:
          type: string
          format: uuid
        instanceId:
          type: string
          format: uuid
        assetId:
          type: string
          format: uuid
        state:
          type: string
          enum:
            - queued
            - released
            - failed
        reason:
          type:
            - string
            - 'null'
          enum:
            - withdrawn
            - unsupported
            - abandoned
            - null
          description: Why a failed delivery stopped.
        queuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    AssetInstance:
      type: object
      additionalProperties: false
      required:
        - instanceId
        - applicationName
        - instanceName
        - lastSeenAt
        - canReceive
        - reportsLibrary
        - delivery
        - installedGeneration
        - updateAvailable
      properties:
        instanceId:
          type: string
          format: uuid
        applicationName:
          type: string
        instanceName:
          type: string
        lastSeenAt:
          type:
            - string
            - 'null'
          format: date-time
        canReceive:
          type: boolean
        reportsLibrary:
          type: boolean
        delivery:
          oneOf:
            - $ref: '#/components/schemas/QueuedDelivery'
            - type: 'null'
        installedGeneration:
          type:
            - integer
            - 'null'
        updateAvailable:
          type: boolean
    AssetInstanceList:
      type: object
      additionalProperties: false
      required:
        - contentGeneration
        - items
      properties:
        contentGeneration:
          type: integer
          minimum: 1
        items:
          type: array
          items:
            $ref: '#/components/schemas/AssetInstance'
    SendAssetRequest:
      type: object
      additionalProperties: false
      required:
        - instanceId
      properties:
        instanceId:
          type: string
          format: uuid
    LegacyAsset:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
