openapi: 3.1.0
info:
  title: LumiHub API
  version: 0.1.0
paths:
  /v1/account/discord:
    delete:
      operationId: detachDiscord
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: The account with Discord detached
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "401": { description: No account is signed in }
        "409": { description: Discord is absent or is the last usable sign-in method }
  /v1/account/email:
    patch:
      operationId: changeUnverifiedEmail
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeEmailRequest" }
      responses:
        "200":
          description: The account with a fresh verification link sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { description: The address is not valid }
        "401": { description: No account is signed in }
        "409": { description: The address is verified here or elsewhere }
  /v1/account/handle:
    patch:
      operationId: renameHandle
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenameHandleRequest" }
      responses:
        "200":
          description: The account under its new handle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { description: The handle is not valid }
        "401": { description: No account is signed in }
        "403": { description: The signed-in account has not verified its email }
        "409": { description: The handle is active or retired }
  /v1/account/password:
    put:
      operationId: setPassword
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordRequest" }
      responses:
        "200":
          description: The account with a password set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { description: The password is empty }
        "401": { description: No account is signed in }
        "409": { description: The account already has a password }
  /v1/account/nsfw-visibility:
    put:
      operationId: setNsfwVisibility
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NsfwVisibilityRequest" }
      responses:
        "204": { description: The reader's content preference is saved }
        "400": { description: The visibility value is invalid }
        "401": { description: No account is signed in }
  /v1/auth/sign-up:
    post:
      operationId: signUp
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignUpRequest" }
      responses:
        "201":
          description: The new signed-in account
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { description: The account details are not valid }
        "409": { description: The handle or verified address is already claimed }
  /v1/auth/sign-in:
    post:
      operationId: signIn
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignInRequest" }
      responses:
        "200":
          description: The signed-in account
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "401": { description: The credentials do not identify one account }
  /v1/auth/discord:
    get:
      operationId: beginDiscord
      parameters:
        - name: intent
          in: query
          schema: { type: string, enum: [sign-in, attach], default: sign-in }
      responses:
        "303": { description: Continue on Discord }
        "401": { description: Attaching Discord requires a signed-in account }
        "403": { description: Attaching Discord requires a verified account }
        "503": { description: Discord sign-in is not configured }
  /v1/auth/discord/callback:
    get:
      operationId: completeDiscord
      parameters:
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: code, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        "303": { description: Continue on LumiHub }
  /v1/auth/sign-out:
    post:
      operationId: signOut
      responses:
        "204": { description: The session no longer exists }
  /v1/auth/session:
    get:
      operationId: getSession
      responses:
        "200":
          description: The account at this origin, when one is signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionState" }
  /v1/auth/verify-email:
    post:
      operationId: verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyEmailRequest" }
      responses:
        "200":
          description: The account with its address verified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { description: The link is invalid, expired or has already lost the address }
        "409": { description: Another account verified the address first }
  /v1/auth/password-reset:
    post:
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetRequest" }
      responses:
        "204": { description: A reset is sent when the verified account exists }
        "400": { description: The request is not valid JSON }
  /v1/auth/password-reset/complete:
    post:
      operationId: completePasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompletePasswordResetRequest" }
      responses:
        "204": { description: The password is set }
        "400": { description: The link or password is invalid }
  /v1/profiles/{handle}:
    get:
      operationId: getProfile
      parameters:
        - { name: handle, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The active public profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "404": { description: No active profile uses the handle }
  /v1/assets:
    get:
      operationId: listAssets
      parameters:
        -
          name: kind
          in: query
          schema: { type: string, enum: [character, lorebook, preset, theme] }
        - { name: platform, in: query, schema: { type: string } }
        -
          name: creator
          in: query
          description: Scope the listing to one creator's public profile.
          schema: { type: string }
        -
          name: q
          in: query
          description: >-
            One search expression. Bare text matches names, creator handles and
            blurbs. Repeat tag: to require every tag; one author: qualifier may
            narrow the creator. Quote qualifier values that contain spaces.
          schema: { type: string }
        - { name: facet, in: query, schema: { type: array, items: { type: string } } }
        -
          name: nsfw
          in: query
          description: >-
            The reader's presentation preference. Browse page URLs keep this
            preference out of their own query string.
          schema: { type: string, enum: [hidden, blurred, shown] }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 24 } }
        - name: before
          in: query
          description: >-
            The made date of the last asset on the previous page. Send it with
            beforeId or not at all.
          schema: { type: string, format: date-time }
        - name: beforeId
          in: query
          description: The id of that same asset
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Assets a visitor may see
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetList"
    post:
      operationId: createAsset
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        description: >-
          Send the metadata part before the file part. The file is read as it
          arrives, so the catalog fields have to be known by then.
        content:
          multipart/form-data:
            schema:
              type: object
              required: [metadata, file]
              properties:
                metadata:
                  $ref: "#/components/schemas/CreateAssetRequest"
                file: { type: string, format: binary }
      responses:
        "202":
          description: The durable ingest operation for the accepted upload
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestOperation" }
        "401": { description: No account is signed in }
        "403": { description: The signed-in account has not verified its email }
  /v1/assets/{id}:
    get:
      operationId: getAsset
      description: >-
        One asset by id. Unlisted assets answer normally, because unlisted is
        discovery rather than authorization. Withheld, deleted and never-existed
        all answer 404.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        -
          name: nsfw
          in: query
          description: >-
            The reader's presentation preference. Asset page URLs keep this
            preference out of their own query string.
          schema: { type: string, enum: [hidden, blurred, shown] }
      responses:
        "200":
          description: The asset as a visitor may see it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetDetail" }
        "404": { description: No asset a visitor may see }
  /v1/assets/{id}/discovery:
    put:
      operationId: setAssetDiscovery
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssetDiscoveryRequest" }
      responses:
        "204": { description: The asset discovery state is saved }
        "400": { description: The discovery value is invalid }
        "401": { description: No account is signed in }
        "403": { description: The signed-in account has not verified its email }
        "404": { description: The asset does not belong to the creator }
        "409": { description: The asset is withheld and cannot be changed }
  /v1/assets/{id}/withhold:
    put:
      operationId: withholdAsset
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WithholdAssetRequest" }
      responses:
        "204": { description: The asset is withheld }
        "400": { description: The reason is empty or invalid }
        "401": { description: No account is signed in }
        "403": { description: The signed-in account is not an admin }
        "404": { description: No live asset has that id }
    delete:
      operationId: clearAssetWithhold
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: The asset is no longer withheld }
        "401": { description: No account is signed in }
        "403": { description: The signed-in account is not an admin }
        "404": { description: No withheld asset has that id }
  /download/{id}:
    get:
      operationId: downloadSource
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The current uploaded source file, byte for byte
          headers:
            Content-Disposition:
              required: true
              schema: { type: string, enum: [attachment, inline] }
            X-Content-Type-Options:
              required: true
              schema: { type: string, enum: [nosniff] }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
            image/gif:
              schema: { type: string, format: binary }
        "404":
          description: No such asset
  /v1/assets/{id}/media:
    get:
      operationId: listMedia
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Asset-scoped media and media from the current revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaList" }
        "404": { description: No such asset }
    post:
      operationId: addMedia
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        description: Send the metadata part before the image file part.
        content:
          multipart/form-data:
            schema:
              type: object
              required: [metadata, file]
              properties:
                metadata:
                  $ref: "#/components/schemas/AddMediaRequest"
                file: { type: string, format: binary }
      responses:
        "201":
          description: A new immutable media record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Media" }
        "400": { description: The role or image is not valid }
        "401": { description: No account is signed in }
        "403": { description: The signed-in account has not verified its email }
        "404": { description: The asset does not belong to the creator }
        "409": { description: The asset is withheld and cannot be changed }
  /media/{media_id}/{variant}/{derivative_version}:
    get:
      operationId: getMediaVariant
      parameters:
        - { name: media_id, in: path, required: true, schema: { type: string, format: uuid } }
        - name: variant
          in: path
          required: true
          schema:
            type: string
            enum: [grid, grid_blurred, detail, detail_blurred, thumb, thumb_blurred, og, og_blurred]
        - { name: derivative_version, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: A named media variant
          headers:
            Cache-Control:
              required: true
              schema: { type: string }
            Content-Disposition:
              required: true
              schema: { type: string, enum: [inline] }
            X-Content-Type-Options:
              required: true
              schema: { type: string, enum: [nosniff] }
          content:
            image/png:
              schema: { type: string, format: binary }
        "404": { description: No such media variant }
  /v1/ingests/{id}:
    get:
      operationId: getIngest
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The creator's ingest operation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestOperation" }
        "401": { description: No account is signed in }
        "403": { description: The signed-in account has not verified its email }
        "404": { description: No such ingest operation for this creator }
    patch:
      operationId: completeIngest
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompleteIngestRequest" }
      responses:
        "202":
          description: The ingest operation queued again with its passthrough kind
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestOperation" }
        "400": { description: The kind or name is invalid }
        "401": { description: No account is signed in }
        "403": { description: The signed-in account has not verified its email }
        "404": { description: No such ingest operation awaiting a kind }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: lumihub_session
  schemas:
    Account:
      type: object
      required: [id, handle, email, emailVerified, discordLinked, hasPassword, role]
      properties:
        id: { type: string, format: uuid }
        handle: { type: string }
        email: { type: [string, "null"], format: email }
        emailVerified: { type: boolean }
        discordLinked: { type: boolean }
        hasPassword: { type: boolean }
        role: { type: string, enum: [user, moderator, admin] }
    ChangeEmailRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    SessionState:
      type: object
      required: [user]
      properties:
        user:
          anyOf:
            - { $ref: "#/components/schemas/Account" }
            - { type: "null" }
    Profile:
      type: object
      required: [id, handle]
      properties:
        id: { type: string, format: uuid }
        handle: { type: string }
    RenameHandleRequest:
      type: object
      required: [handle]
      properties:
        handle: { type: string, minLength: 3, maxLength: 32 }
    SignUpRequest:
      type: object
      required: [email, password, handle]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1 }
        handle: { type: string, minLength: 3, maxLength: 32 }
    SignInRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    PasswordRequest:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 1 }
    NsfwVisibilityRequest:
      type: object
      additionalProperties: false
      required: [visibility]
      properties:
        visibility: { type: string, enum: [hidden, blurred, shown] }
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    CompletePasswordResetRequest:
      type: object
      required: [token, password]
      properties:
        token: { type: string }
        password: { type: string, minLength: 1 }
    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }
    Asset:
      type: object
      required: [id, kind, format, name, blurb, tags, isNsfw, discovery, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        passthroughPlatform: { type: [string, "null"] }
        format: { type: string }
        name: { type: string }
        blurb: { type: string }
        tags: { type: array, items: { type: string } }
        isNsfw: { type: boolean }
        discovery: { type: string, enum: [listed, unlisted] }
        createdAt: { type: string, format: date-time }
    AssetDetail:
      type: object
      required:
        [id, kind, name, blurb, tags, creator, isNsfw, discovery, createdAt,
         media, preview, visibility]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [character, lorebook, preset, theme] }
        name: { type: string }
        blurb:
          type: string
          description: >-
            The catalog blurb the creator wrote for a person. Never the file's
            own description, which is a prompt written for a model.
        tags:
          type: array
          items: { $ref: "#/components/schemas/AssetTag" }
        creator: { type: string }
        isNsfw: { type: boolean }
        discovery: { type: string, enum: [listed, unlisted] }
        createdAt: { type: string, format: date-time }
        media:
          type: array
          description: >-
            The asset's images, cover first. Variant URLs already reflect the
            reader's preference, so a blurred reader is never handed a clear one.
          items: { $ref: "#/components/schemas/AssetImage" }
        preview:
          description: The composed social preview for link unfurling.
          anyOf:
            - { type: string }
            - { type: "null" }
        visibility: { type: string, enum: [hidden, blurred, shown] }
        withhold:
          $ref: "#/components/schemas/AssetWithhold"
    AssetDiscoveryRequest:
      type: object
      additionalProperties: false
      required: [discovery]
      properties:
        discovery: { type: string, enum: [listed, unlisted] }
    WithholdAssetRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1 }
    AssetWithhold:
      type: object
      additionalProperties: false
      required: [reason, actor, at]
      properties:
        reason: { type: string }
        actor: { type: string }
        at: { type: string, format: date-time }
    AssetTag:
      type: object
      required: [label, value]
      properties:
        label:
          type: string
          description: The creator's own text, shown as written.
        value:
          type: string
          description: The normalized form browse matches on.
    AssetImage:
      type: object
      required: [id, role, detailUrl, thumbUrl, width, height]
      properties:
        id: { type: string, format: uuid }
        role:
          type: string
          enum: [avatar, expression, gallery, avatar_alt, perspective_layer]
        detailUrl: { type: string }
        thumbUrl: { type: string }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
    AssetList:
      type: object
      required: [items, total, suppressed, visibility, platforms, facets, emptyState]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/BrowseAsset" }
        total: { type: integer, minimum: 0 }
        suppressed: { type: integer, minimum: 0 }
        visibility: { type: string, enum: [hidden, blurred, shown] }
        nextCursor:
          anyOf:
            - { $ref: "#/components/schemas/BrowseCursor" }
            - { type: "null" }
        platforms:
          type: array
          items: { $ref: "#/components/schemas/BrowseOption" }
        facets:
          type: array
          items: { $ref: "#/components/schemas/BrowseFacet" }
        emptyState:
          type: [string, "null"]
          enum: [catalog, no_matches, suppressed, null]
    BrowseAsset:
      type: object
      required: [id, name, creator, kind, isNsfw, cover]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        creator: { type: string }
        kind: { type: string, enum: [character, lorebook, preset, theme] }
        isNsfw: { type: boolean }
        ownerState:
          type: string
          enum: [unlisted, withheld]
          description: Present only on the owner's own listing.
        withhold:
          $ref: "#/components/schemas/AssetWithhold"
        cover:
          anyOf:
            - { $ref: "#/components/schemas/BrowseCover" }
            - { type: "null" }
    BrowseCover:
      type: object
      required: [url, width, height]
      properties:
        url: { type: string }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
    BrowseCursor:
      type: object
      required: [before, beforeId]
      properties:
        before: { type: string, format: date-time }
        beforeId: { type: string, format: uuid }
    BrowseOption:
      type: object
      required: [value, label, count, selected]
      properties:
        value: { type: string }
        label: { type: string }
        count: { type: integer, minimum: 0 }
        selected: { type: boolean }
    BrowseFacet:
      type: object
      required: [key, label, options]
      properties:
        key: { type: string }
        label: { type: string }
        options:
          type: array
          items: { $ref: "#/components/schemas/BrowseOption" }
    CreateAssetRequest:
      type: object
      required: [confirmed]
      properties:
        confirmed: { type: boolean }
        name: { type: string }
        blurb: { type: string }
        tags: { type: array, items: { type: string } }
        isNsfw: { type: boolean }
        discovery: { type: string, enum: [listed, unlisted] }
    AddMediaRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          type: string
          enum: [avatar, expression, gallery, avatar_alt, perspective_layer]
    Media:
      type: object
      required: [id, assetId, revisionId, role, width, height, derivativeVersion]
      properties:
        id: { type: string, format: uuid }
        assetId: { type: [string, "null"], format: uuid }
        revisionId: { type: [string, "null"], format: uuid }
        role:
          type: string
          enum: [avatar, expression, gallery, avatar_alt, perspective_layer]
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        derivativeVersion: { type: integer, minimum: 1 }
    MediaList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Media" }
    IngestOperation:
      type: object
      required: [id, status, url]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending, processing, needs_kind, failed, success] }
        url: { type: string }
        asset:
          anyOf:
            - { $ref: "#/components/schemas/Asset" }
            - { type: "null" }
        needsKind:
          $ref: "#/components/schemas/NeedsKind"
        failure:
          $ref: "#/components/schemas/IngestFailure"
    NeedsKind:
      type: object
      additionalProperties: false
      required: [kind, name]
      properties:
        kind: { type: [string, "null"], enum: [character, lorebook, preset, theme, null] }
        name: { type: string }
    CompleteIngestRequest:
      type: object
      additionalProperties: false
      required: [kind, name]
      properties:
        kind: { type: string, enum: [character, lorebook, preset, theme] }
        name: { type: string, minLength: 1 }
    IngestFailure:
      type: object
      required: [reason, message]
      properties:
        reason:
          type: string
          enum: [malformed_input, unsupported_format, unsupported_version, safety_violation, internal_failure]
        message: { type: string }
