worker_processes 1;
pid /tmp/lumihub-nginx.pid;
error_log stderr warn;

events {
    worker_connections 256;
}

http {
    access_log /dev/stdout;

    # The site's dev server keeps a websocket open for reloads.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 127.0.0.1:8000;
        client_max_body_size 34m;
        add_header X-Content-Type-Options nosniff always;

        location /download/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /media/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # The wire contract and the guide that explains it, served by the API so
        # they always match the build answering the calls.
        location = /openapi.yaml {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /protocol {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /_lumihub/blobs/ {
            internal;
            alias api/uploads/blobs/;
        }

        location /_lumihub/derivatives/ {
            internal;
            alias api/uploads/derivatives/;
        }

        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
