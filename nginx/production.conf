worker_processes auto;
pid /tmp/illarin-nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 ipv6=off valid=10s;

    map $request_uri $request_uri_for_log {
        default $request_uri;
        ~^/link(?:\?|$) /link;
        ~^/(?:api/)?v1/link/requests/ /v1/link/requests/[code-redacted];
        ~^/(?:api/)?v1/link/authorizations/ /v1/link/authorizations/[code-redacted];
    }

    map $http_referer $referer_for_log {
        default $http_referer;
        ~^https?://[^/]+/link(?:\?|$) /link;
    }

    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        ~^https$ https;
        ~^http$ http;
    }

    map $http_x_forwarded_for $forwarded_for {
        default $http_x_forwarded_for;
        "" $remote_addr;
    }

    limit_req_zone $forwarded_for zone=account_auth:10m rate=30r/m;

    log_format redacted '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $request_uri_for_log $server_protocol" '
                        '$status $body_bytes_sent "$referer_for_log" "$http_user_agent"';
    access_log /dev/stdout redacted;

    server_tokens off;

    server {
        listen 8080;
        client_max_body_size 34m;
        add_header X-Content-Type-Options nosniff always;

        set $api_upstream http://api:8080;
        set $web_upstream http://web:3000;

        location = /gateway-healthz {
            access_log off;
            return 204;
        }

        location /download/ {
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-For $forwarded_for;
        }

        location /delivery/ {
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-For $forwarded_for;
        }

        location /media/ {
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-For $forwarded_for;
        }

        location = /openapi.yaml {
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-For $forwarded_for;
        }

        location = /protocol {
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-For $forwarded_for;
        }

        location ~ ^/api/v1/auth/(?:sign-up|sign-in|password-reset(?:/complete)?)$ {
            limit_req zone=account_auth burst=20 nodelay;
            limit_req_status 429;
            proxy_pass $web_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-For $forwarded_for;
        }

        # A delivery wait holds one connection for up to thirty seconds and a
        # library report can be large. Both are machine traffic with no page
        # around them, so they go straight to the API rather than through the
        # site's rewrite, which would hold a Node connection for every waiting
        # installation.
        location = /api/v1/deliveries/collect {
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass $api_upstream;
            proxy_read_timeout 60s;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-For $forwarded_for;
        }

        location = /api/v1/library/sync {
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-For $forwarded_for;
        }

        location /_illarin/blobs/ {
            internal;
            alias /data/uploads/blobs/;
        }

        location /_illarin/derivatives/ {
            internal;
            alias /data/uploads/derivatives/;
        }

        location = /link {
            error_log /dev/null emerg;
            proxy_pass $web_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-For $forwarded_for;
        }

        location ~ ^/api/v1/link/(?:requests|authorizations)/[^/]+(?:/(?:approve|deny))?$ {
            error_log /dev/null emerg;
            proxy_pass $web_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-For $forwarded_for;
        }

        location / {
            proxy_pass $web_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-For $forwarded_for;
        }
    }
}
