worker_processes 1;
pid /tmp/lumihub-nginx.pid;
error_log stderr warn;

events {
    worker_connections 256;
}

http {
    map $request_uri $request_uri_for_log {
        default $request_uri;
        ~^/link(?:\?|$) /link;
        ~^/(?:api/)?v1/link/requests/ /v1/link/requests/[code-redacted];
        ~^/(?:api/)?v1/link/authorizations/ /v1/link/authorizations/[code-redacted];
    }

    map $http_referer $referer_for_log {
        default $http_referer;
        ~^https?://[^/]+/link(?:\?|$) /link;
    }

    log_format redacted '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $request_uri_for_log $server_protocol" '
                        '$status $body_bytes_sent "$referer_for_log" "$http_user_agent"';
    access_log /dev/stdout redacted;

    # The site's dev server keeps a websocket open for reloads.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 127.0.0.1:8000;
        client_max_body_size 34m;
        add_header X-Content-Type-Options nosniff always;

        location /download/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /media/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # The wire contract and the guide that explains it, served by the API so
        # they always match the build answering the calls.
        location = /openapi.yaml {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /protocol {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /_lumihub/blobs/ {
            internal;
            alias api/uploads/blobs/;
        }

        location /_lumihub/derivatives/ {
            internal;
            alias api/uploads/derivatives/;
        }

        # nginx error messages can contain the unformatted request target, so
        # secret-bearing browser and review URLs need a quiet proxy location as
        # well as the redacted access log above.
        location = /link {
            error_log /dev/null emerg;
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location ~ ^/api/v1/link/(?:requests|authorizations)/[^/]+(?:/(?:approve|deny))?$ {
            error_log /dev/null emerg;
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Replace, rather than append to, a caller-supplied forwarding
            # chain. The API uses this edge-observed address for rate limits.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
