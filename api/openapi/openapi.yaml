openapi: 3.1.0
info:
  title: LumiHub API
  version: 0.1.0
paths:
  /v1/account/discord:
    delete:
      operationId: detachDiscord
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: The account with Discord detached
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "401": { description: No account is signed in }
        "409": { description: Discord is absent or is the last usable sign-in method }
  /v1/account/email:
    patch:
      operationId: changeUnverifiedEmail
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeEmailRequest" }
      responses:
        "200":
          description: The account with a fresh verification link sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { description: The address is not valid }
        "401": { description: No account is signed in }
        "409": { description: The address is verified here or elsewhere }
  /v1/account/handle:
    patch:
      operationId: renameHandle
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenameHandleRequest" }
      responses:
        "200":
          description: The account under its new handle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { description: The handle is not valid }
        "401": { description: No account is signed in }
        "403": { description: The signed-in account has not verified its email }
        "409": { description: The handle is active or retired }
  /v1/account/password:
    put:
      operationId: setPassword
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordRequest" }
      responses:
        "200":
          description: The account with a password set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { description: The password is empty }
        "401": { description: No account is signed in }
        "409": { description: The account already has a password }
  /v1/account/nsfw-visibility:
    put:
      operationId: setNsfwVisibility
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NsfwVisibilityRequest" }
      responses:
        "204": { description: The reader's content preference is saved }
        "400": { description: The visibility value is invalid }
        "401": { description: No account is signed in }
  /v1/auth/sign-up:
    post:
      operationId: signUp
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignUpRequest" }
      responses:
        "201":
          description: The new signed-in account
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { description: The account details are not valid }
        "409": { description: The handle or verified address is already claimed }
  /v1/auth/sign-in:
    post:
      operationId: signIn
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignInRequest" }
      responses:
        "200":
          description: The signed-in account
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "401": { description: The credentials do not identify one account }
  /v1/auth/discord:
    get:
      operationId: beginDiscord
      parameters:
        - name: intent
          in: query
          schema: { type: string, enum: [sign-in, attach], default: sign-in }
      responses:
        "303": { description: Continue on Discord }
        "401": { description: Attaching Discord requires a signed-in account }
        "403": { description: Attaching Discord requires a verified account }
        "503": { description: Discord sign-in is not configured }
  /v1/auth/discord/callback:
    get:
      operationId: completeDiscord
      parameters:
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: code, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        "303": { description: Continue on LumiHub }
  /v1/auth/sign-out:
    post:
      operationId: signOut
      responses:
        "204": { description: The session no longer exists }
  /v1/auth/session:
    get:
      operationId: getSession
      responses:
        "200":
          description: The account at this origin, when one is signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionState" }
  /v1/auth/verify-email:
    post:
      operationId: verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyEmailRequest" }
      responses:
        "200":
          description: The account with its address verified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { description: The link is invalid, expired or has already lost the address }
        "409": { description: Another account verified the address first }
  /v1/auth/password-reset:
    post:
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetRequest" }
      responses:
        "204": { description: A reset is sent when the verified account exists }
        "400": { description: The request is not valid JSON }
  /v1/auth/password-reset/complete:
    post:
      operationId: completePasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompletePasswordResetRequest" }
      responses:
        "204": { description: The password is set }
        "400": { description: The link or password is invalid }
  /v1/link/requests:
    post:
      operationId: startLinkRequest
      description: >-
        Start linking a client application to a creator's account. Anyone may
        call this: LumiHub authenticates the creator and the individual
        installation, never the software vendor, so there is no registration
        step, no client id and no client secret.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartLinkRequest" }
      responses:
        "201":
          description: The codes the client shows and the code it keeps
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinkRequest" }
        "400": { description: The name or the requested scopes are not valid }
  /v1/link/poll:
    post:
      operationId: pollLinkRequest
      description: >-
        Ask whether the creator has approved yet. Wait at least the interval the
        link request came with between calls.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PollLinkRequest" }
      responses:
        "200":
          description: Still waiting, or linked and holding the credential
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinkPollResult" }
        "404": { description: The link request has expired, was redeemed, or never existed }
        "429":
          description: Polled faster than the interval
          headers:
            Retry-After:
              schema: { type: integer }
  /v1/link/requests/{userCode}:
    get:
      operationId: getLinkRequest
      description: What the client behind a user code is asking for.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: userCode, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The name and scopes to show before approving
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PendingLink" }
        "401": { description: No account is signed in }
        "403": { description: The signed-in account has not verified its email }
        "404": { description: No unapproved link request has that code }
        "429": { description: Too many codes were entered }
  /v1/link/requests/{userCode}/approve:
    post:
      operationId: approveLinkRequest
      description: >-
        Approve a link request. A link request may be approved once and redeemed
        once.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: userCode, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: What was approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PendingLink" }
        "401": { description: No account is signed in }
        "403": { description: The signed-in account has not verified its email }
        "404": { description: No unapproved link request has that code }
        "429": { description: Too many codes were entered }
  /v1/instances:
    get:
      operationId: listInstances
      description: >-
        Every instance linked to the signed-in account, live ones first, then
        the record of the ones they revoked.
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: The creator's linked instances
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinkedInstanceList" }
        "401": { description: No account is signed in }
  /v1/instances/me:
    get:
      operationId: getInstance
      description: >-
        The instance the bearer credential belongs to. Every authenticated
        request updates lastSeenAt, and this one exists so a client can check
        its credential without sending anything.
      security: [{ instanceToken: [] }]
      responses:
        "200":
          description: The instance holding the credential
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinkedInstance" }
        "401": { description: The credential does not identify a live instance }
  /v1/instances/{id}:
    delete:
      operationId: revokeInstance
      description: >-
        Cut an instance off. Its credential stops working immediately and the
        state it held here is discarded. A record that it was linked and revoked
        stays.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: The instance is revoked }
        "401": { description: No account is signed in }
        "404": { description: The account has no live instance with that id }
  /v1/profiles/{handle}:
    get:
      operationId: getProfile
      parameters:
        - { name: handle, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The active public profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "404": { description: No active profile uses the handle }
  /v1/assets:
    get:
      operationId: listAssets
      parameters:
        -
          name: kind
          in: query
          schema: { type: string, enum: [character, lorebook, preset, theme] }
        - { name: platform, in: query, schema: { type: string } }
        -
          name: creator
          in: query
          description: Scope the listing to one creator's public profile.
          schema: { type: string }
        -
          name: q
          in: query
          description: >-
            One search expression. Bare text matches names, creator handles and
            blurbs. Repeat tag: to require every tag; one author: qualifier may
            narrow the creator. Quote qualifier values that contain spaces.
          schema: { type: string }
        - { name: facet, in: query, schema: { type: array, items: { type: string } } }
        -
          name: nsfw
          in: query
          description: >-
            The reader's presentation preference. Browse page URLs keep this
            preference out of their own query string.
          schema: { type: string, enum: [hidden, blurred, shown] }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 24 } }
        - name: before
          in: query
          description: >-
            The made date of the last asset on the previous page. Send it with
            beforeId or not at all.
          schema: { type: string, format: date-time }
        - name: beforeId
          in: query
          description: The id of that same asset
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Assets a visitor may see
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetList"
    post:
      operationId: createAsset
      security: [{ sessionCookie: [] }]
      description: >-
        Two ways to make an asset. Send form data to bring a file in, or send
        JSON naming a kind to start from nothing. The kind is asked for once,
        before any blocks exist, and never changes afterwards.
      requestBody:
        required: true
        description: >-
          Send the metadata part before the file part. The file is read as it
          arrives, so the catalog fields have to be known by then.
        content:
          multipart/form-data:
            schema:
              type: object
              required: [metadata, file]
              properties:
                metadata:
                  $ref: "#/components/schemas/CreateAssetRequest"
                file: { type: string, format: binary }
          application/json:
            schema: { $ref: "#/components/schemas/StartAssetRequest" }
      responses:
        "201":
          description: The draft that was started, with the blocks its kind requires
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetDetail" }
        "202":
          description: The durable ingest operation for the accepted upload
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestOperation" }
        "401": { description: No account is signed in }
        "403": { description: The signed-in account has not verified its email }
        "422": { description: The uploaded bytes have been purged and cannot return }
  /v1/assets/{id}:
    get:
      operationId: getAsset
      description: >-
        One asset by id. Unlisted assets answer normally, because unlisted is
        discovery rather than authorization. Withheld, deleted and never-existed
        all answer 404.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        -
          name: nsfw
          in: query
          description: >-
            The reader's presentation preference. Asset page URLs keep this
            preference out of their own query string.
          schema: { type: string, enum: [hidden, blurred, shown] }
      responses:
        "200":
          description: The asset as a visitor may see it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetDetail" }
        "404": { description: No asset a visitor may see }
    delete:
      operationId: deleteAsset
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: The asset is recoverable from the creator's Deleted section }
        "401": { description: No account is signed in }
        "403": { description: The signed-in account has not verified its email }
        "404": { description: The asset does not belong to the creator }
        "409": { description: The asset is withheld and cannot be deleted }
  /v1/assets/{id}/revisions:
    post:
      operationId: addAssetRevision
      description: >-
        Replace an asset's source bytes. A revision is the file only: name,
        blurb, tags and the NSFW flag stay as the creator left them. A file that
        reads as a different kind is refused and the asset is left untouched.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "202":
          description: The durable ingest operation for the accepted revision
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestOperation" }
        "401": { description: No account is signed in }
        "403": { description: The signed-in account has not verified its email }
        "404": { description: The asset does not belong to the creator }
        "409": { description: The asset is withheld and cannot be changed }
  /v1/assets/{id}/blocks/{blockId}:
    put:
      operationId: saveAssetBlock
      description: >-
        Save one block without rewriting any other block on the asset. Draft
        content may be empty, but it must still be structurally valid and obey
        the kind catalog's builder constraints.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: blockId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveAssetBlockRequest" }
      responses:
        "200":
          description: The saved block as it now appears on the page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetBlock" }
        "400": { description: The block is malformed or breaks a builder constraint }
        "401": { description: No account is signed in }
        "403": { description: The signed-in account has not verified its email }
        "404": { description: The asset or block does not belong to the creator }
        "409": { description: The asset is withheld and cannot be changed }
        "422": { description: The uploaded bytes have been purged and cannot return }
  /v1/assets/{id}/file-patch:
    put:
      operationId: setFilePatch
      description: >-
        Replace the creator's semantic changes to the file. Omitted fields are
        removed from the patch. Catalog metadata is a separate concern and is
        never written into the artifact.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FileFieldPatch" }
      responses:
        "204": { description: The creator's file patch is saved }
        "400": { description: The body is not a supported semantic patch }
        "401": { description: No account is signed in }
        "403": { description: The signed-in account has not verified its email }
        "404": { description: The asset does not belong to the creator }
        "409": { description: The asset is withheld or its format cannot be patched }
  /v1/assets/{id}/restore:
    post:
      operationId: restoreAsset
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: The existing asset and retained bytes are live again }
        "401": { description: No account is signed in }
        "403": { description: The signed-in account has not verified its email }
        "404": { description: No recoverable asset belongs to the creator }
  /v1/assets/{id}/identity:
    put:
      operationId: setAssetIdentity
      description: >-
        Save the header fields that sit above an asset's blocks. The adult
        content answer may be null only while the asset is a draft, so nothing
        answers it on the creator's behalf. An edit is live when it saves.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssetIdentityRequest" }
      responses:
        "204": { description: The header is saved }
        "400": { description: The name is too long, or a published asset was sent no adult content answer }
        "401": { description: No account is signed in }
        "403": { description: The signed-in account has not verified its email }
        "404": { description: The asset does not belong to the creator }
        "409": { description: The asset is withheld and cannot be changed }
  /v1/assets/{id}/publish:
    post:
      operationId: publishAsset
      description: >-
        Publish a draft. Publishing is one-way: unlisted is the reversible
        retreat and deletion is the exit. A draft that does not meet the floor
        is refused with the whole readiness list rather than the first thing
        missing.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The asset as its page now reads, published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetDetail" }
        "401": { description: No account is signed in }
        "403": { description: The signed-in account has not verified its email }
        "404": { description: The draft does not belong to the creator }
        "409":
          description: >-
            The draft is not ready, the asset is already published, or it is
            withheld
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublishRefusal" }
  /v1/assets/{id}/discovery:
    put:
      operationId: setAssetDiscovery
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssetDiscoveryRequest" }
      responses:
        "204": { description: The asset discovery state is saved }
        "400": { description: The discovery value is invalid }
        "401": { description: No account is signed in }
        "403": { description: The signed-in account has not verified its email }
        "404": { description: The asset does not belong to the creator }
        "409": { description: The asset is withheld and cannot be changed }
  /v1/profiles/{handle}/deleted:
    get:
      operationId: listDeletedAssets
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: handle, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The signed-in creator's assets still inside the recovery window
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeletedAssetList" }
        "401": { description: No account is signed in }
        "403": { description: The signed-in account has not verified its email }
  /v1/assets/{id}/withhold:
    put:
      operationId: withholdAsset
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WithholdAssetRequest" }
      responses:
        "204": { description: The asset is withheld }
        "400": { description: The reason is empty or invalid }
        "401": { description: No account is signed in }
        "403": { description: The signed-in account is not an admin }
        "404": { description: No live asset has that id }
    delete:
      operationId: clearAssetWithhold
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: The asset is no longer withheld }
        "401": { description: No account is signed in }
        "403": { description: The signed-in account is not an admin }
        "404": { description: No withheld asset has that id }
  /download/{id}:
    get:
      operationId: downloadSource
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The current uploaded source file, byte for byte
          headers:
            Content-Disposition:
              required: true
              schema: { type: string, enum: [attachment, inline] }
            X-Content-Type-Options:
              required: true
              schema: { type: string, enum: [nosniff] }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
            image/gif:
              schema: { type: string, format: binary }
        "404":
          description: No such asset
  /download/{id}/{target}:
    get:
      operationId: downloadExport
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        -
          name: target
          in: path
          required: true
          description: A declared export target. Unsupported values fall back to raw.
          schema: { type: string }
      responses:
        "200":
          description: The current revision exported to the resolved target
          headers:
            Content-Disposition:
              required: true
              schema: { type: string, enum: [attachment, inline] }
            X-Content-Type-Options:
              required: true
              schema: { type: string, enum: [nosniff] }
            X-LumiHub-Export-Target:
              required: true
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
            application/json:
              schema: { type: string, format: binary }
            application/zip:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        "404":
          description: No such asset
  /v1/assets/{id}/media:
    get:
      operationId: listMedia
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Media belonging to the asset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaList" }
        "404": { description: No such asset }
    post:
      operationId: addMedia
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        description: Send the metadata part before the image file part.
        content:
          multipart/form-data:
            schema:
              type: object
              required: [metadata, file]
              properties:
                metadata:
                  $ref: "#/components/schemas/AddMediaRequest"
                file: { type: string, format: binary }
      responses:
        "201":
          description: A new immutable media record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Media" }
        "400": { description: The role or image is not valid }
        "401": { description: No account is signed in }
        "403": { description: The signed-in account has not verified its email }
        "404": { description: The asset does not belong to the creator }
        "409": { description: The asset is withheld and cannot be changed }
  /media/{media_id}/{variant}/{derivative_version}:
    get:
      operationId: getMediaVariant
      parameters:
        - { name: media_id, in: path, required: true, schema: { type: string, format: uuid } }
        - name: variant
          in: path
          required: true
          schema:
            type: string
            enum: [grid, grid_blurred, detail, detail_blurred, thumb, thumb_blurred, og, og_blurred]
        - { name: derivative_version, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - name: expires
          in: query
          description: >-
            When the signature runs out. A draft's images are served against a
            short-lived signature at the same address they keep once published.
          schema: { type: string }
        - { name: signature, in: query, schema: { type: string } }
      responses:
        "200":
          description: A named media variant
          headers:
            Cache-Control:
              required: true
              schema: { type: string }
            Content-Disposition:
              required: true
              schema: { type: string, enum: [inline] }
            X-Content-Type-Options:
              required: true
              schema: { type: string, enum: [nosniff] }
          content:
            image/png:
              schema: { type: string, format: binary }
        "404": { description: No such media variant }
  /v1/ingests/{id}:
    get:
      operationId: getIngest
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The creator's ingest operation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestOperation" }
        "401": { description: No account is signed in }
        "403": { description: The signed-in account has not verified its email }
        "404": { description: No such ingest operation for this creator }
    patch:
      operationId: completeIngest
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompleteIngestRequest" }
      responses:
        "202":
          description: The ingest operation queued again with its passthrough kind
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestOperation" }
        "400": { description: The kind or name is invalid }
        "401": { description: No account is signed in }
        "403": { description: The signed-in account has not verified its email }
        "404": { description: No such ingest operation awaiting a kind }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: lumihub_session
    instanceToken:
      type: http
      scheme: bearer
      description: The credential a linked instance received when it was approved.
  schemas:
    Scope:
      type: string
      enum: [asset:receive, library:sync]
      description: >-
        asset:receive lets an instance receive assets sent to it. library:sync
        lets it report what it has installed.
    StartLinkRequest:
      type: object
      additionalProperties: false
      required: [name, scopes]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: >-
            What the creator sees on the approval screen. Name the installation,
            not the product, so somebody with two of them can tell which is which.
        scopes:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/Scope" }
    LinkRequest:
      type: object
      required:
        [deviceCode, userCode, verificationUrl, verificationUrlComplete,
         expiresAt, interval]
      properties:
        deviceCode:
          type: string
          description: Kept private by the client and sent when polling.
        userCode:
          type: string
          description: Shown to the creator, who enters it on LumiHub.
        verificationUrl:
          type: string
          description: Where the creator enters the user code.
        verificationUrlComplete:
          type: string
          description: >-
            The same page with the code already filled in. A client running on
            the creator's own machine may open it.
        expiresAt: { type: string, format: date-time }
        interval:
          type: integer
          description: Seconds to wait between polls.
    PollLinkRequest:
      type: object
      additionalProperties: false
      required: [deviceCode]
      properties:
        deviceCode: { type: string }
    LinkPollResult:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [pending, linked] }
        token:
          type: string
          description: >-
            The instance credential, sent once and never again. It does not
            expire and there is nothing to refresh.
        instance:
          $ref: "#/components/schemas/LinkedInstance"
    PendingLink:
      type: object
      required: [name, scopes, expiresAt]
      properties:
        name: { type: string }
        scopes:
          type: array
          items: { $ref: "#/components/schemas/Scope" }
        expiresAt: { type: string, format: date-time }
    LinkedInstance:
      type: object
      required: [id, name, prefix, scopes, linkedAt, lastSeenAt, revokedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix:
          type: string
          description: The start of the credential, so two links are told apart.
        scopes:
          type: array
          items: { $ref: "#/components/schemas/Scope" }
        linkedAt: { type: string, format: date-time }
        lastSeenAt: { type: [string, "null"], format: date-time }
        revokedAt: { type: [string, "null"], format: date-time }
    LinkedInstanceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/LinkedInstance" }
    Account:
      type: object
      required: [id, handle, email, emailVerified, discordLinked, hasPassword, role]
      properties:
        id: { type: string, format: uuid }
        handle: { type: string }
        email: { type: [string, "null"], format: email }
        emailVerified: { type: boolean }
        discordLinked: { type: boolean }
        hasPassword: { type: boolean }
        role: { type: string, enum: [user, moderator, admin] }
    ChangeEmailRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    SessionState:
      type: object
      required: [user]
      properties:
        user:
          anyOf:
            - { $ref: "#/components/schemas/Account" }
            - { type: "null" }
    Profile:
      type: object
      required: [id, handle]
      properties:
        id: { type: string, format: uuid }
        handle: { type: string }
    RenameHandleRequest:
      type: object
      required: [handle]
      properties:
        handle: { type: string, minLength: 3, maxLength: 32 }
    SignUpRequest:
      type: object
      required: [email, password, handle]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1 }
        handle: { type: string, minLength: 3, maxLength: 32 }
    SignInRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    PasswordRequest:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 1 }
    NsfwVisibilityRequest:
      type: object
      additionalProperties: false
      required: [visibility]
      properties:
        visibility: { type: string, enum: [hidden, blurred, shown] }
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    CompletePasswordResetRequest:
      type: object
      required: [token, password]
      properties:
        token: { type: string }
        password: { type: string, minLength: 1 }
    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }
    StartAssetRequest:
      type: object
      additionalProperties: false
      required: [kind]
      description: >-
        The kind an asset is built as. Only kinds Illarin can build are
        accepted, so a creator is never handed an empty page.
      properties:
        kind: { type: string }
    AssetBlock:
      type: object
      description: >-
        A titled container. Required, hideable, the layouts it allows and its
        default width are read from the kind catalog at render time, so this is
        what the catalog says today rather than what was true when the block was
        made.
      required:
        [id, definition, title, titleIsDefault, position, hidden, layout, width,
         allowedLayouts, required, hideable, isEmpty, elements]
      properties:
        id: { type: string, format: uuid }
        definition: { type: string }
        title:
          type: string
          description: The creator's wording, or the definition's default where they wrote none.
        titleIsDefault: { type: boolean }
        position: { type: integer }
        hidden: { type: boolean }
        layout:
          type: string
          enum: [single, duo, main-aside, trio, stack-2, stack-3]
        width: { type: string, enum: [full, two_thirds, half, third] }
        allowedLayouts:
          type: array
          description: The layouts this block's current definition offers.
          items: { type: string, enum: [single, duo, main-aside, trio, stack-2, stack-3] }
        required: { type: boolean }
        hideable: { type: boolean }
        isEmpty:
          type: boolean
          description: >-
            Whether every element in the block carries nothing. Computed for
            display and never stored.
        elements:
          type: array
          items: { $ref: "#/components/schemas/AssetElement" }
    SaveAssetBlockRequest:
      type: object
      additionalProperties: false
      required: [title, layout, width, elements]
      properties:
        title:
          type: [string, "null"]
          description: Null keeps the definition's current default wording.
        layout:
          type: string
          enum: [single, duo, main-aside, trio, stack-2, stack-3]
        width: { type: string, enum: [full, two_thirds, half, third] }
        elements:
          type: array
          items: { $ref: "#/components/schemas/SaveAssetElement" }
    SaveAssetElement:
      type: object
      additionalProperties: false
      required: [id, type, slot, content]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [prose, text_set, dialogue_sample, image_set] }
        role:
          type: string
          description: Absent where the element has no import or export meaning.
        slot: { type: string }
        display: { type: string, enum: [rich, verbatim] }
        content:
          description: The element type's own body.
          x-go-type: json.RawMessage
          oneOf:
            - $ref: "#/components/schemas/ProseContent"
            - $ref: "#/components/schemas/TextSetContent"
            - $ref: "#/components/schemas/DialogueSampleContent"
            - $ref: "#/components/schemas/ImageSetContent"
    AssetElement:
      type: object
      description: >-
        One piece of content. Its role is what import and export read, and it
        travels with the element wherever the creator moves it.
      required: [id, type, slot, label, pinned, isEmpty, content]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [prose, text_set, dialogue_sample, image_set] }
        role:
          type: string
          description: Absent where the element has no import or export meaning.
        slot: { type: string }
        label: { type: string }
        pinned:
          type: boolean
          description: A pinned element can be neither removed nor moved out of its block.
        display: { type: string, enum: [rich, verbatim] }
        isEmpty: { type: boolean }
        content:
          description: The element type's own body. A reader switches on type to read it.
          x-go-type: json.RawMessage
          oneOf:
            - $ref: "#/components/schemas/ProseContent"
            - $ref: "#/components/schemas/TextSetContent"
            - $ref: "#/components/schemas/DialogueSampleContent"
            - $ref: "#/components/schemas/ImageSetContent"
    ProseContent:
      type: object
      required: [text]
      properties:
        text: { type: string }
    TextSetContent:
      type: object
      required: [texts]
      properties:
        texts:
          type: array
          items:
            type: object
            required: [text]
            properties:
              name: { type: string }
              text: { type: string }
    DialogueSampleContent:
      type: object
      required: [turns]
      properties:
        turns:
          type: array
          items:
            type: object
            required: [speaker, text]
            properties:
              speaker: { type: string }
              text: { type: string }
    ImageSetContent:
      type: object
      required: [images]
      properties:
        images:
          type: array
          items:
            type: object
            required: [mediaId]
            properties:
              mediaId: { type: string, format: uuid }
              name: { type: string }
    Asset:
      type: object
      required: [id, kind, format, name, blurb, tags, isNsfw, discovery, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        passthroughPlatform: { type: [string, "null"] }
        format: { type: string }
        name: { type: string }
        blurb: { type: string }
        tags: { type: array, items: { type: string } }
        isNsfw: { type: [boolean, "null"] }
        discovery: { type: string, enum: [listed, unlisted] }
        createdAt: { type: string, format: date-time }
    AssetDetail:
      type: object
      required:
        [id, kind, name, blurb, tags, creator, isNsfw, discovery, lifecycle,
         isOwner, hasSourceFile, createdAt, blocks, media, preview, visibility]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [character, lorebook, preset, theme] }
        name: { type: string }
        blurb:
          type: string
          description: >-
            The catalog blurb the creator wrote for a person. Never the file's
            own description, which is a prompt written for a model.
        tags:
          type: array
          items: { $ref: "#/components/schemas/AssetTag" }
        creator: { type: string }
        isNsfw:
          description: >-
            Null while a draft has not been asked the adult content question.
            Nothing answers it on the creator's behalf.
          type: [boolean, "null"]
        discovery: { type: string, enum: [listed, unlisted] }
        lifecycle:
          type: string
          enum: [draft, published]
          description: >-
            A draft resolves for its owner alone. Discovery applies to a
            published asset only.
        isOwner:
          type: boolean
          description: >-
            Whether the reader owns the asset. The owner's page is the reader's
            page with its editing affordances, not a second visual state.
        hasSourceFile:
          type: boolean
          description: >-
            Whether the asset carries a file a reader can download. An asset
            built from nothing carries none.
        createdAt: { type: string, format: date-time }
        blocks:
          type: array
          description: The asset's blocks in page order.
          items: { $ref: "#/components/schemas/AssetBlock" }
        media:
          type: array
          description: >-
            The asset's images, cover first. Variant URLs already reflect the
            reader's preference, so a blurred reader is never handed a clear one.
          items: { $ref: "#/components/schemas/AssetImage" }
        preview:
          description: >-
            The composed social preview for link unfurling. Null on a draft,
            which nothing unfurls.
          anyOf:
            - { type: string }
            - { type: "null" }
        readiness:
          description: >-
            What publication is waiting on. Present only while the owner is
            reading their own draft.
          type: array
          items: { $ref: "#/components/schemas/ReadinessItem" }
        visibility: { type: string, enum: [hidden, blurred, shown] }
        withhold:
          $ref: "#/components/schemas/AssetWithhold"
    AssetDiscoveryRequest:
      type: object
      additionalProperties: false
      required: [discovery]
      properties:
        discovery: { type: string, enum: [listed, unlisted] }
    AssetIdentityRequest:
      type: object
      additionalProperties: false
      required: [name, isNsfw]
      properties:
        name: { type: string }
        isNsfw:
          description: >-
            Null is the unanswered state, which only a draft may be in.
          type: [boolean, "null"]
    ReadinessItem:
      type: object
      required: [id, label, detail, met]
      description: One thing publication waits on, and whether the asset carries it.
      properties:
        id: { type: string }
        label: { type: string }
        detail: { type: string }
        met: { type: boolean }
        blockId:
          description: The block a creator fills this in. Absent for a header field.
          type: string
          format: uuid
    PublishRefusal:
      type: object
      required: [error]
      properties:
        error: { type: string }
        readiness:
          description: The whole floor, so a refusal names every missing item at once.
          type: array
          items: { $ref: "#/components/schemas/ReadinessItem" }
    FileFieldPatch:
      type: object
      additionalProperties: false
      properties:
        description: { type: string }
        personality: { type: string }
        scenario: { type: string }
        first_mes: { type: string }
        system_prompt: { type: string }
        post_history_instructions: { type: string }
        creator_notes: { type: string }
        character_version: { type: string }
    DeletedAssetList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DeletedAsset" }
    DeletedAsset:
      type: object
      required: [id, name, kind, deletedAt, recoverableUntil]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [character, lorebook, preset, theme] }
        deletedAt: { type: string, format: date-time }
        recoverableUntil: { type: string, format: date-time }
    WithholdAssetRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1 }
    AssetWithhold:
      type: object
      additionalProperties: false
      required: [reason, actor, at]
      properties:
        reason: { type: string }
        actor: { type: string }
        at: { type: string, format: date-time }
    AssetTag:
      type: object
      required: [label, value]
      properties:
        label:
          type: string
          description: The creator's own text, shown as written.
        value:
          type: string
          description: The normalized form browse matches on.
    AssetImage:
      type: object
      required: [id, role, isCover, detailUrl, thumbUrl, width, height]
      properties:
        id: { type: string, format: uuid }
        role:
          type: string
          enum: [avatar, expression, gallery, avatar_alt, perspective_layer]
        isCover: { type: boolean }
        detailUrl: { type: string }
        thumbUrl: { type: string }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
    AssetList:
      type: object
      required: [items, total, suppressed, visibility, platforms, facets, emptyState]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/BrowseAsset" }
        total: { type: integer, minimum: 0 }
        suppressed: { type: integer, minimum: 0 }
        visibility: { type: string, enum: [hidden, blurred, shown] }
        nextCursor:
          anyOf:
            - { $ref: "#/components/schemas/BrowseCursor" }
            - { type: "null" }
        platforms:
          type: array
          items: { $ref: "#/components/schemas/BrowseOption" }
        facets:
          type: array
          items: { $ref: "#/components/schemas/BrowseFacet" }
        emptyState:
          type: [string, "null"]
          enum: [catalog, no_matches, suppressed, null]
    BrowseAsset:
      type: object
      required: [id, name, creator, kind, isNsfw, cover]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        creator: { type: string }
        kind: { type: string, enum: [character, lorebook, preset, theme] }
        isNsfw:
          description: >-
            Null on a draft whose creator has not answered the adult content
            question.
          type: [boolean, "null"]
        ownerState:
          type: string
          enum: [draft, unlisted, withheld]
          description: Present only on the owner's own listing.
        withhold:
          $ref: "#/components/schemas/AssetWithhold"
        cover:
          anyOf:
            - { $ref: "#/components/schemas/BrowseCover" }
            - { type: "null" }
    BrowseCover:
      type: object
      required: [url, width, height]
      properties:
        url: { type: string }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
    BrowseCursor:
      type: object
      required: [before, beforeId]
      properties:
        before: { type: string, format: date-time }
        beforeId: { type: string, format: uuid }
    BrowseOption:
      type: object
      required: [value, label, count, selected]
      properties:
        value: { type: string }
        label: { type: string }
        count: { type: integer, minimum: 0 }
        selected: { type: boolean }
    BrowseFacet:
      type: object
      required: [key, label, options]
      properties:
        key: { type: string }
        label: { type: string }
        options:
          type: array
          items: { $ref: "#/components/schemas/BrowseOption" }
    CreateAssetRequest:
      type: object
      required: [confirmed]
      properties:
        confirmed: { type: boolean }
        name: { type: string }
        blurb: { type: string }
        tags: { type: array, items: { type: string } }
        isNsfw: { type: boolean }
        discovery: { type: string, enum: [listed, unlisted] }
    AddMediaRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          type: string
          enum: [avatar, expression, gallery, avatar_alt, perspective_layer]
    Media:
      type: object
      required: [id, assetId, role, width, height, derivativeVersion]
      properties:
        id: { type: string, format: uuid }
        assetId: { type: string, format: uuid }
        role:
          type: string
          enum: [avatar, expression, gallery, avatar_alt, perspective_layer]
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        derivativeVersion: { type: integer, minimum: 1 }
    MediaList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Media" }
    IngestOperation:
      type: object
      required: [id, status, url]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending, processing, needs_kind, failed, success] }
        url: { type: string }
        asset:
          anyOf:
            - { $ref: "#/components/schemas/Asset" }
            - { type: "null" }
        needsKind:
          $ref: "#/components/schemas/NeedsKind"
        failure:
          $ref: "#/components/schemas/IngestFailure"
    NeedsKind:
      type: object
      additionalProperties: false
      required: [kind, name]
      properties:
        kind: { type: [string, "null"], enum: [character, lorebook, preset, theme, null] }
        name: { type: string }
    CompleteIngestRequest:
      type: object
      additionalProperties: false
      required: [kind, name]
      properties:
        kind: { type: string, enum: [character, lorebook, preset, theme] }
        name: { type: string, minLength: 1 }
    IngestFailure:
      type: object
      required: [reason, message]
      properties:
        reason:
          type: string
          enum:
            [
              malformed_input,
              unsupported_format,
              unsupported_version,
              safety_violation,
              wrong_kind,
              internal_failure,
            ]
        message: { type: string }
